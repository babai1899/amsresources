<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | AMS RESOURCES</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
    <a href="index.html"><button class="btn blue">Back</button></a>
</div>
</div>

<!-- HEADER -->
<header class="header">
    <div class="logo">
        <img src="images/AMS logo.png" alt="AMS Logo">
        <div>
            <h1>AMS RESOURCES</h1>
            <p><span>|</span>MANPOWER CONSULTANCY</p>
        </div>
    </div>
</header>

<section class="login-section">
    <div class="login-container">

        <!-- LEFT -->
        <div class="login-image">
            <img src="images/login.jpg" alt="Login">
        </div>

        <!-- RIGHT -->
        <div class="login-box">
            <h2><span></span>LOGIN</h2>

            <form id="loginForm">
                <label>Username<span>*</span></label>
                <input id="username" type="text" placeholder="Enter username" required>

                <label>Password<span>*</span></label>
                <input id="password" type="password" placeholder="Enter password" required>

                <button type="submit">Login</button>

                <p id="loginError" style="color:red; margin-top:10px;"></p>

                <div class="login-links">
                    <a href="#">Forgot Password?</a>
                    <a href="#">New User? Register</a>
                </div>
            </form>
        </div>

    </div>
</section>

<script src="js/login.js"></script>

</body>
</html>
